services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comiku}
      POSTGRES_USER: ${POSTGRES_USER:-comiku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comiku_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - comiku_postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: comiku_test
      POSTGRES_USER: comiku
      POSTGRES_PASSWORD: comiku_dev
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comiku -d comiku_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  comiku_postgres_data:
