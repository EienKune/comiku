name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm db:validate
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/server/src/source-ingestion/adapters/gallery-dl/python/requirements.txt
      - run: python -m unittest discover -s apps/server/src/source-ingestion/adapters/gallery-dl/python
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s apps/server/src/image-analysis/adapters/ba-pixai/python/tests
      - run: pnpm build
      - run: pnpm --filter @comiku/server build:ops
      - run: pnpm api:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: comiku_test
          POSTGRES_USER: comiku
          POSTGRES_PASSWORD: comiku_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comiku -d comiku_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://comiku:comiku_ci@127.0.0.1:5432/comiku_test
      TEST_DATABASE_URL: postgresql://comiku:comiku_ci@127.0.0.1:5432/comiku_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:deploy
      - run: pnpm db:status
      - run: pnpm db:drift
      - run: pnpm test:integration

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml config --quiet
      - run: docker build --target runtime --build-arg COMIKU_RELEASE=test-ci -f deploy/Dockerfile -t comiku-server:test .
      - run: docker build --target tools --build-arg COMIKU_RELEASE=test-ci -f deploy/Dockerfile -t comiku-tools:test .
      - run: docker build --target backup --build-arg COMIKU_RELEASE=test-ci -f deploy/Dockerfile -t comiku-backup:test .
      - name: Isolated Linux HTTPS and recovery drill (no real X/R2)
        run: node scripts/test-production-images.mjs
